name: Run Tests

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Run Tests
              run: |
                docker compose up -d
                # docker compose exec mariadb healthcheck.sh --su-mysql --connect --innodb_initialized
                docker compose down
